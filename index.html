<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红玫瑰的知识花园</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#f7f2e8;
color:#333;
font-family:"Microsoft YaHei",sans-serif;
}
a{text-decoration:none;color:inherit}
.top{
position:sticky;
top:0;
z-index:10;
background:#fffaf0;
padding:15px 30px;
display:flex;
align-items:center;
gap:30px;
box-shadow:0 2px 10px #0001;
}
.logo{font-size:26px;font-weight:bold;color:#6b4f3a}
.logo span{color:#a23b50}
.search{flex:1;border-radius:30px;border:1px solid #ddd;padding:12px 20px}
.hero{
padding:70px 40px;
color:white;
background:linear-gradient(135deg,#6b4f3a,#a23b50)
}
.hero h1{font-size:50px;margin:20px 0}
.layout{
max-width:1200px;
margin:35px auto;
display:grid;
grid-template-columns:220px 1fr;
gap:30px;
padding:0 20px
}
.sidebar,.box{
background:white;
border-radius:22px;
padding:25px;
box-shadow:0 10px 30px #0001;
}
.menu button{
width:100%;
padding:13px;
margin:6px 0;
border:0;
border-radius:12px;
background:#fff;
cursor:pointer;
text-align:left;
}
.menu button:hover{
background:#fff0f3;
color:#a23b50;
}
.avatar{
display:flex;
align-items:center;
gap:20px;
}
.avatar img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
}
.gallery img{
width:180px;
height:180px;
object-fit:cover;
border-radius:15px;
margin:10px;
}
audio{width:100%}
.hidden{display:none}
.card{
padding:20px;
background:#faf7ef;
border-radius:15px;
margin-top:15px;
}
@media(max-width:800px){
.layout{grid-template-columns:1fr}
.hero h1{font-size:34px}
}
</style>
</head>

<body>

<header class="top">
<div class="logo">红玫瑰的<span>知识花园</span></div>
<input class="search" placeholder="搜索故事、思考、图片">
</header>

<section class="hero">
<p>PERSONAL KNOWLEDGE GARDEN</p>
<h1>把生活慢慢整理成自己的花园</h1>
<p>收藏故事、思想、图片、音乐和人生记录。</p>
</section>


<div class="layout">

<aside class="sidebar">
<h2>🌱 花园目录</h2>
<div class="menu">
<button onclick="show('home')">🏡 首页</button>
<button onclick="show('story')">🌙 睡前故事</button>
<button onclick="show('mind')">🧠 思维导图</button>
<button onclick="show('photo')">🖼 图片花园</button>
<button onclick="show('quote')">✍️ 每日金句</button>
<button onclick="show('music')">🎵 喜爱音乐</button>
<button onclick="show('message')">💌 读者留言</button>
</div>
</aside>


<main id="content">

<div id="home">
<div class="box avatar">
<img src="assets/images/avatar.jpg">
<div>
<h2>🌹 关于我的花园</h2>
<p>记录故事、阅读、思考和成长，让时间留下痕迹。</p>
</div>
</div>

<div class="box">
<h2>🌳 我的知识树</h2>
<p>📚 阅读　💭 思考　✍️ 创作　🛠 技术　🎵 音乐</p>
</div>

<div class="box">
<h2>🌙 最新故事</h2>
<p>欢迎来到第一个睡前故事。</p>
</div>
</div>


<div id="story" class="hidden box">
<h2>🌙 睡前故事</h2>
<h3>我的第一个故事</h3>
<audio controls>
<source src="assets/audio/story001.m4a">
</audio>
</div>


<div id="mind" class="hidden box">
<h2>🧠 思维导图</h2>
<p>这里展示知识整理和学习导图。</p>
<img width="300" src="assets/mindmap/story.svg">
</div>


<div id="photo" class="hidden box gallery">
<h2>🖼 图片花园</h2>
<img src="assets/images/photo1.jpg">
<img src="assets/images/photo2.jpg">
</div>


<div id="quote" class="hidden box">
<h2>✍️ 每日金句</h2>
<div class="card">今天值得记录的一句话。</div>
</div>


<div id="music" class="hidden box">
<h2>🎵 喜爱音乐</h2>
<p>收藏喜欢的音乐和故事。</p>
</div>


<div id="message" class="hidden box">
<h2>💌 读者留言</h2>
<textarea style="width:100%;height:150px" placeholder="留下你的留言"></textarea>
</div>

</main>
</div>


<script>
function show(id){
let pages=document.querySelectorAll("#content>div");
pages.forEach(p=>p.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}
</script>

</body>
</html>
