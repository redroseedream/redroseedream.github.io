<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>红玫瑰的知识花园</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#f5f1e8;
color:#333;
font-family:"Microsoft YaHei",sans-serif;
}
.topbar{
position:sticky;
top:0;
z-index:10;
background:#f8f1e7;
padding:15px 30px;
display:flex;
align-items:center;
gap:20px;
}
.logo{font-size:26px;font-weight:bold;color:#6b4f3a}
.logo span{color:#9f3f50}
.search{flex:1;padding:12px;border-radius:30px;border:1px solid #ccc}
.hero{
background:linear-gradient(135deg,#6b4f3a,#9f3f50);
color:white;
padding:60px 40px;
}
.hero h1{font-size:48px}
.container{
max-width:1200px;
margin:35px auto;
display:grid;
grid-template-columns:230px 1fr;
gap:30px;
padding:0 20px;
}
.sidebar,.box{
background:white;
border-radius:22px;
padding:25px;
box-shadow:0 8px 25px #0001;
}
.menu button{
width:100%;
padding:12px;
margin:6px 0;
border:0;
border-radius:12px;
background:white;
cursor:pointer;
text-align:left;
font-size:15px;
}
.menu button:hover{
background:#fff0f3;
color:#9f3f50;
}
.profile{
display:flex;
align-items:center;
gap:20px;
}
.profile img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
}
.gallery{
display:flex;
flex-wrap:wrap;
}
.gallery img{
width:180px;
height:180px;
object-fit:cover;
border-radius:15px;
margin:10px;
}
audio{width:100%}
textarea{border:1px solid #ddd;border-radius:10px;padding:10px}
@media(max-width:800px){
.container{grid-template-columns:1fr}
.hero h1{font-size:32px}
}
</style>
</head>

<body>

<header class="topbar">
<div class="logo">红玫瑰的<span>知识花园</span></div>
<input class="search" placeholder="搜索故事、阅读、思考">
</header>

<section class="hero">
<p>PERSONAL KNOWLEDGE GARDEN</p>
<h1>把生活慢慢整理成自己的花园</h1>
<p>这里收藏我的故事、阅读、思考与成长。</p>
</section>

<main class="container">

<aside class="sidebar">
<h2>🌱 花园目录</h2>

<div class="menu">
<button onclick="showHome()">🏡 首页</button>
<button onclick="showPage('story')">🌙 睡前故事</button>
<button onclick="showPage('book')">📚 阅读收藏</button>
<button onclick="showPage('thought')">💭 思想森林</button>
<button onclick="showPage('growth')">🌱 成长记录</button>
<button onclick="showPage('message')">💌 读者留言</button>
<button onclick="showPage('photo')">🖼 图片花园</button>
</div>

</aside>


<section id="content">

</section>

</main>


<script>

function showHome(){

document.getElementById("content").innerHTML=`

<div class="box profile">

<img src="avatar.jpg">

<div>
<h2>🌹 关于我的花园</h2>
<p>记录故事、阅读、思考和成长，让时间留下痕迹。</p>
</div>

</div>


<div class="box">
<h2>🌳 我的知识树</h2>
<p>📚 阅读　💭 思考　✍️ 创作　🛠 技术</p>
</div>


<div class="box">
<h2>🌙 今晚故事</h2>
<audio controls>
<source src="story001.m4a" type="audio/mp4">
</audio>
</div>

`;

}


function showPage(type){

let pages={

story:`
<div class="box">
<h2>🌙 睡前故事</h2>
<h3>我的第一个故事</h3>
<audio controls>
<source src="story001.m4a" type="audio/mp4">
</audio>
<p>这里以后可以添加更多故事。</p>
</div>
`,


book:`
<div class="box">
<h2>📚 阅读收藏</h2>
<p>这里记录喜欢的书籍。</p>
</div>
`,


thought:`
<div class="box">
<h2>💭 思想森林</h2>
<p>这里记录文章、思考和灵感。</p>
</div>
`,


growth:`
<div class="box">
<h2>🌱 成长记录</h2>
<p>这里记录学习、技能和人生经历。</p>
</div>
`,


message:`
<div class="box">
<h2>💌 读者留言</h2>
<textarea style="width:100%;height:150px" placeholder="留下你的留言"></textarea>
</div>
`,


photo:`
<div class="box gallery">
<h2>🖼 图片花园</h2>

<img src="avatar.jpg">

<img src="photo1.jpg">

<img src="photo2.jpg">

</div>
`

};

document.getElementById("content").innerHTML=pages[type];

}

showHome();

</script>

</body>
</html>
